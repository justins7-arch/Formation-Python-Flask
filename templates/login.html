{% extends "base.html" %}

{% block title %}{{ _('Connexion') }}{% endblock %}

{% block contenu %}
<section class="auth-box auth-login-shell">
    <div class="card auth-card premium-auth-card">
        <div class="auth-brand">
            <img src="{{ url_for('static', filename='img/stade-communal-logo.svg') }}" alt="Logo Stade Communal" class="brand-logo auth-logo">
            <div>
                <strong>StadeControl</strong>
                <small>Stade Communal · Billetterie</small>
            </div>
        </div>

        <h2>{{ _('Connexion') }}</h2>
        <form method="POST">
            <label for="username">{{ _('Nom d\'utilisateur') }}</label>
            <input id="username" name="username" type="text" required>

            <label for="password">{{ _('Mot de passe') }}</label>
            <input id="password" name="password" type="password" required>

            <button type="submit" class="primary-btn">{{ _('login') }}</button>
        </form>
        <div class="auth-info">
            <p>Vous n'avez pas de compte ?</p>
            <strong>Veuillez contacter l'Admin Système.</strong>
            <p class="auth-developer">Développé par <strong>Justin SAÏDI</strong></p>
        </div>
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Changer le thème">
            <span aria-hidden="true">☾</span> Mode sombre
        </button>
    </div>
</section>
{% endblock %}
