{% extends "base.html" %}

{% block title %}{{ _('Nouvel événement') }}{% endblock %}

{% block contenu %}
<h2>{{ _('Créer un événement') }}</h2>
<form method="POST">
    <label for="nom">{{ _('Nom de l\'événement') }}</label>
    <input id="nom" type="text" name="nom" required>

    <label for="date">Date de début</label>
    <input id="date" type="date" name="date" required>

    <label for="date_fin">Date de fin</label>
    <input id="date_fin" type="date" name="date_fin" required>

    <label for="lieu">{{ _('Lieu') }}</label>
    <input id="lieu" type="text" name="lieu" required>

    <label for="latitude">Latitude du stade (facultatif)</label>
    <input id="latitude" type="number" name="latitude" step="any" placeholder="Ex. -4.3276">

    <label for="longitude">Longitude du stade (facultatif)</label>
    <input id="longitude" type="number" name="longitude" step="any" placeholder="Ex. 15.3136">

    <label for="capacite">{{ _('Capacité') }}</label>
    <input id="capacite" type="number" name="capacite" min="1" required>

    <label for="taux_conversion">{{ _('event_exchange_rate') }}</label>
    <input id="taux_conversion" type="number" name="taux_conversion" min="1" step="0.01" value="2800" required>
    <small>{{ _('event_exchange_help') }}</small>

    <button type="submit">{{ _('Enregistrer') }}</button>
</form>
<script>
const startDate = document.getElementById('date');
const endDate = document.getElementById('date_fin');
startDate.addEventListener('change', () => {
    endDate.min = startDate.value;
    if (endDate.value && endDate.value < startDate.value) endDate.value = startDate.value;
});
</script>
{% endblock %}
